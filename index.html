<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Server</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0f1420; color: #e6e9f0; font-family: system-ui, sans-serif;
  }
  main { width: min(420px, 92vw); }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: #8b93a7; margin: 0 0 1.5rem; }
  #status {
    border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem;
    background: #171d2e; border: 1px solid #262e44; font-size: .95rem;
  }
  #status.ok { border-color: #2f7d4f; color: #7fe0a5; }
  #status.err { border-color: #7d2f2f; color: #f0a0a0; }
  button {
    width: 100%; padding: .85rem; font-size: 1.05rem; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer;
    background: #3b82f6; color: #fff; transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .55; cursor: default; }
  details { margin-top: 1.5rem; color: #8b93a7; font-size: .85rem; }
  details summary { cursor: pointer; }
  details label { display: block; margin-top: .5rem; }
  details input {
    width: 100%; margin-top: .25rem; padding: .4rem .5rem;
    background: #171d2e; color: #e6e9f0; border: 1px solid #262e44;
    border-radius: 6px; font-family: monospace;
  }
  details .row { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; }
  details .row input { width: auto; }
  details button {
    width: auto; padding: .4rem .8rem; font-size: .85rem; font-weight: 500;
    background: #232b45; margin-top: .75rem;
  }
</style>
</head>
<body>
<main>
  <h1>Minecraft Server</h1>
  <p class="sub">Starts the server on your machine if it isn&rsquo;t already running.</p>
  <div id="status">Idle.</div>
  <button id="start" disabled>Start Server</button>
  <details>
    <summary>Settings</summary>
    <label>GitHub owner
      <input id="owner" placeholder="your-github-username" autocomplete="off">
    </label>
    <label>Repository
      <input id="repo" placeholder="mc-server-page" autocomplete="off">
    </label>
    <label>Fine-grained token (Actions: read &amp; write, this repo only)
      <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    </label>
    <label class="row"><input id="remember" type="checkbox"> Remember on this device</label>
    <button id="save">Save settings</button>
  </details>
</main>
<script>
const LS = { owner: "mcPage.owner", repo: "mcPage.repo", token: "mcPage.token" };
const startBtn = document.getElementById("start");
const statusEl = document.getElementById("status");

function load() {
  document.getElementById("owner").value = localStorage.getItem(LS.owner) || "";
  document.getElementById("repo").value = localStorage.getItem(LS.repo) || "";
  document.getElementById("token").value = localStorage.getItem(LS.token) || "";
  document.getElementById("remember").checked = !!localStorage.getItem(LS.token);
  syncStart();
}

function syncStart() {
  const owner = document.getElementById("owner").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const token = document.getElementById("token").value.trim();
  startBtn.disabled = !(owner && repo && token);
}

document.querySelectorAll("#owner, #repo, #token").forEach(el =>
  el.addEventListener("input", syncStart));

document.getElementById("save").addEventListener("click", () => {
  const token = document.getElementById("token").value.trim();
  if (document.getElementById("remember").checked) {
    localStorage.setItem(LS.owner, document.getElementById("owner").value.trim());
    localStorage.setItem(LS.repo, document.getElementById("repo").value.trim());
    localStorage.setItem(LS.token, token);
  } else {
    ["owner", "repo", "token"].forEach(k => localStorage.removeItem(LS[k]));
  }
  setStatus("Settings saved.", "ok");
});

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = cls || "";
}

async function dispatch(owner, repo, token) {
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/dispatches`, {
    method: "POST",
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": `Bearer ${token}`,
      "X-GitHub-Api-Version": "2022-11-28",
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ event_type: "start-server" }),
  });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw new Error(`GitHub API ${r.status}: ${data.message || r.statusText}`);
  }
}

async function pollRun(owner, repo, token) {
  const url = `https://api.github.com/repos/${owner}/${repo}/actions/runs?event=repository_dispatch&per_page=1`;
  for (let i = 0; i < 40; i++) {
    const r = await fetch(url, {
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": `Bearer ${token}`,
        "X-GitHub-Api-Version": "2022-11-28",
      },
    });
    if (r.ok) {
      const data = await r.json();
      const run = (data.workflow_runs || [])[0];
      if (run && run.status === "completed") {
        return run.conclusion === "success"
          ? { ok: true, msg: "Done: server started (or was already running)." }
          : { ok: false, msg: `Workflow finished with status: ${run.conclusion}` };
      }
    }
    await new Promise(res => setTimeout(res, 3000));
  }
  return { ok: true, msg: "Request sent. Check the Actions tab if it never reports back." };
}

startBtn.addEventListener("click", async () => {
  const owner = document.getElementById("owner").value.trim();
  const repo = document.getElementById("repo").value.trim();
  const token = document.getElementById("token").value.trim();
  if (!owner || !repo || !token) return;

  startBtn.disabled = true;
  setStatus("Triggering the server start...");
  try {
    await dispatch(owner, repo, token);
    setStatus("Request accepted. Waiting for your machine to report back...");
    const result = await pollRun(owner, repo, token);
    setStatus(result.msg, result.ok ? "ok" : "err");
  } catch (e) {
    setStatus(e.message, "err");
  } finally {
    startBtn.disabled = false;
  }
});

load();
</script>
</body>
</html>
